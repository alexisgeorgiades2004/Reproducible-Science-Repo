# configs/environments.yml
#
# Registry of the small, step-matched environments used in this repository.
# Follows CLAUDE.md -> "Environment" (prefer several small environments; record
# exact versions after each run) and "Code and parameters" (no hard-coded paths).
#
# This file is the single place that maps an environment name to:
#   - the conda spec used to CREATE it (loose pins, human-maintained), and
#   - the steps of the canonical 13-step sequence it is meant to serve.
#
# The 13-step sequence is defined in README.md ("The 13-step sequence") and is
# the single source of truth for step numbering across this repo. `steps` below
# refers to those numbers. The EXACT resolved versions are not stored here; they
# are captured per run by src/record_environment.py into the record directory.

schema_version: 2

paths:
  # All paths are relative to the repository root.
  spec_dir: environment
  record_dir: environment/records

record:
  # Used by src/record_environment.py when naming output files.
  timestamp_format: "%Y%m%dT%H%M%SZ"   # UTC
  filename_template: "{run_id}__{env_name}__{timestamp}"
  write_text_summary: true

environments:

  tools:
    spec: environment/env-tools.yml
    conda_name: rsr-tools
    purpose: >-
      Repository tooling: run src/record_environment.py and the checks in tests/.
      Not used for any scientific computation.
    steps: []                       # no analysis step; repo maintenance only

  ingest:
    spec: environment/env-ingest.yml
    conda_name: rsr-ingest
    purpose: >-
      Obtain raw data into data/raw/, verify checksums, record provenance in
      data/metadata/DATA_SOURCES.md, and report dimensions, metadata columns and
      cohort structure without altering the raw files.
    steps: [1, 2, 3]                # acquisition, load/inspect, cohort

  scrna:
    spec: environment/env-scrna.yml
    conda_name: rsr-scrna
    purpose: >-
      Single-cell processing: QC metrics and filtering, the sparse working
      matrix, normalisation, feature selection, dimensionality reduction,
      clustering, embedding and cell-type annotation.
    steps: [4, 5, 6, 7, 8, 9, 10, 11, 12]

  stats:
    spec: environment/env-stats.yml
    conda_name: rsr-stats
    purpose: >-
      Comparative analysis and statistical testing computed from the tables
      already exported to results/. Does not read the single-cell object.
    steps: [13]                     # condition contrast (responder vs non-responder)

  viz:
    spec: environment/env-viz.yml
    conda_name: rsr-viz
    purpose: >-
      Figures rendered from tables in results/ into figures/. Cross-cutting:
      any step may hand it a table to plot.
    steps: []                       # cross-cutting, not tied to one step

# NOTE: steps 1-9 have been executed; see the Analysis log in README.md for what
# each produced and why. Steps 4-9 were in fact run on numpy/scipy alone rather
# than from env-scrna.yml, which has not yet been built on this machine.