# Central parameters. Notebooks read from here; do not hard-code these values in chunks.
#
# SCOPE: the thresholds below, and the numbers quoted in their comments, were MEASURED on
# this project's dataset (GEO GSE120575, plate-based Smart-seq2). They are not defaults.
# On any other dataset, re-measure before reusing them - in particular the gene-detection
# floor and cap, which were originally written for droplet data and did not fit this one.
seed: 42

qc:
  min_genes_per_cell: 200
  max_genes_per_cell: 6000
  max_percent_mito: 10
  # Mito fraction is computed on the 13 PROTEIN-CODING MT genes only. Matching the
  # bare "MT-" prefix instead picks up all 37 mitochondrial genes including MT-RNR1/2
  # rRNA and 22 tRNAs; MT-RNR2 is the highest-expressed gene in this dataset and that
  # definition puts the median at 12.7%, failing 75% of cells. On the 13 protein-coding
  # genes the median is 2.90% and the 10% cutoff removes 243 cells (1.49%).
  mito_gene_set: protein_coding_13
  # Genes must be detected in at least this many cells (after cell filtering).
  min_cells_per_gene: 3
  # NOTE: max_genes_per_cell above is NOT applied. It is a droplet-data doublet
  # heuristic; this is plate-based Smart-seq2 with one cell per well, and the cap
  # would discard 164 high-complexity cells for a reason that does not apply here.
  apply_max_genes_per_cell: false

normalization:
  # Step 7 is a documented no-op (data are already TPM and log2(TPM+1)); only HVG settings live here.
  n_variable_features: 3000
  # A gene is an HVG candidate only if detected in at least this fraction of cells. The skill default is
  # 0.01; at 0.01 the top 2000 held 29.3% clone-named/small-RNA/mito genes and only 2 of 20 T-cell state
  # genes. At 0.05 with 3000 genes: 9.4% noisy picks, 9 of 20 T-cell state genes (results/step08_hvg_sensitivity.csv).
  hvg_min_cell_fraction: 0.05
  # Exclude T/B-cell receptor V/D/J SEGMENTS from candidacy; constant regions (IGHM, IGKC, TRAC...) are kept.
  hvg_exclude_vdj: true

dimensionality_reduction:
  n_pcs: 30

clustering:
  resolution: 0.5
